<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>班級任務積點系統｜每日紀錄版</title>
<style>
:root{--bg:#f8efec;--panel:#fffaf8;--line:#ead0c9;--green:#167a49;--green2:#e7f5ed;--ink:#342a27;--muted:#7d6d68;--danger:#b94a48;--blue:#376b91;--blue2:#eef5fa;--shadow:0 6px 18px rgba(82,54,45,.06)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:1500px;margin:auto;padding:18px}
.topbar,.datebar,.notice,.panel,.summary{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px}.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand-icon{width:44px;height:44px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:23px}.brand-title{font-weight:900;font-size:19px}.muted{font-size:13px;color:var(--muted)}
.btn,.select,.input{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;color:var(--ink)}.btn{font-weight:800}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.soft{background:var(--green2);color:var(--green);border-color:#a8cfb8}.btn.danger{color:var(--danger)}.class-switch{min-width:170px;font-weight:800}
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:12px 14px}.date-label{font-weight:900;font-size:18px;color:var(--green);min-width:130px}.date-input{min-height:42px;border:1px solid var(--line);background:white;border-radius:12px;padding:8px 10px}
.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:18px;margin-top:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;color:var(--green);margin-top:2px}.notice{margin-top:16px;padding:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tab.active{background:var(--green2);color:var(--green);border-color:var(--green)}.section{margin-top:16px}
.task-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.task-card{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.task-head{background:#fff;padding:15px}
.badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.badge.daily{background:var(--green);color:#fff}.badge.once{background:var(--blue);color:#fff}.task-title{font-size:18px;font-weight:900;margin-top:10px}.meta{font-size:13px;color:var(--muted);margin-top:5px}.progress{height:10px;border-radius:999px;background:#eadeda;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--green)}
.student-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px;background:#fff7f4;border-top:1px solid var(--line)}.student-btn{min-height:54px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px;font-weight:800}.student-btn.done{background:var(--green2);border-color:#9cc8ad;color:var(--green)}.student-btn.once-done{background:var(--blue2);border-color:#aac8db;color:var(--blue)}.student-btn small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.growth-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.growth-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;text-align:center;box-shadow:var(--shadow)}.avatar{display:grid;place-items:center;margin:0 auto 8px;border-radius:999px;background:#fff4ef;border:2px solid var(--line)}.s1{width:60px;height:60px;font-size:30px}.s2{width:74px;height:74px;font-size:37px}.s3{width:88px;height:88px;font-size:44px}.s4{width:102px;height:102px;font-size:51px}.s5{width:118px;height:118px;font-size:60px}.grow-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{padding:15px}.full{grid-column:1/-1}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px}
.manage-row{display:grid;grid-template-columns:1fr 100px 120px auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff8f5;margin-top:8px}.task-manage-row{display:grid;grid-template-columns:1fr 120px 140px auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff8f5;margin-top:8px}.class-manage{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff8f5;margin-top:8px}
.history-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.history-table{width:100%;border-collapse:collapse;min-width:720px}.history-table th,.history-table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.history-table th{background:#fff8f5;position:sticky;top:0}
.modal-backdrop{position:fixed;inset:0;background:rgba(40,30,26,.32);display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(680px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:18px;border:1px solid var(--line);padding:18px;box-shadow:0 18px 50px rgba(50,30,20,.2)}.close-row{display:flex;justify-content:flex-end;margin-top:14px}.report-table{width:100%;border-collapse:collapse;margin-top:10px}.report-table th,.report-table td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
@media(max-width:1100px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}.task-grid,.growth-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.app{padding:10px}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.task-grid,.growth-grid,.settings-grid{grid-template-columns:1fr}.full{grid-column:auto}.manage-row,.task-manage-row{grid-template-columns:1fr}.student-list{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar .btn,.topbar .select{flex:1}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brand-icon">🏫</div><div><div class="brand-title">班級任務積點</div><div class="muted">每日任務 × 歷史紀錄 × 累積成長</div></div></div>
  <select id="classSelect" class="select class-switch"><option value="grade6">🏫 六年級</option><option value="grade5">🏫 五年級</option></select>
  <button class="btn" id="randomBtn">🎲 抽籤</button><button class="btn" id="reportBtn">📄 報表</button><button class="btn" id="backupBtn">💾 備份</button><button class="btn primary" id="newTaskBtn">＋ 新增任務</button>
</header>

<section class="datebar">
  <button class="btn" id="prevDay">← 前一天</button><div class="date-label" id="dateLabel"></div><input id="dateInput" class="date-input" type="date"><button class="btn soft" id="todayBtn">今天</button><button class="btn" id="nextDay">後一天 →</button><span class="muted" id="todayHint"></span>
</section>

<section class="summary">
  <div class="stat"><small>目前班級</small><strong id="sumClass">六年級</strong></div>
  <div class="stat"><small>目前日期</small><strong id="sumDate">—</strong></div>
  <div class="stat"><small>進行中任務</small><strong id="sumTasks">3</strong></div>
  <div class="stat"><small>當日完成率</small><strong id="sumRate">0%</strong></div>
  <div class="stat"><small>班級員額</small><strong id="sumStudents">2 人</strong></div>
</section>

<section class="notice"><b>💡 每日紀錄模式：</b><span class="muted"> 每日任務會依日期分開記錄，隔天自動回到尚未完成，但學生總積分不歸零；一次性任務完成後會持續保留。可切換日期查看或修正歷史紀錄。</span></section>

<nav class="tabs">
  <button class="btn tab active" data-tab="tasks">任務看板</button><button class="btn tab" data-tab="growth">學生角色成長</button><button class="btn tab" data-tab="history">歷史紀錄</button><button class="btn tab" data-tab="settings">教師設定</button>
</nav>

<section id="tasksView" class="section"><div id="taskGrid" class="task-grid"></div></section>
<section id="growthView" class="section hidden"><div id="growthGrid" class="growth-grid"></div></section>
<section id="historyView" class="section hidden"><div class="panel full"><h3>歷史紀錄</h3><div class="muted" style="margin-bottom:10px">顯示目前班級最近 31 天的完成次數與當日得分。</div><div class="history-wrap"><table class="history-table"><thead><tr><th>日期</th><th>完成次數</th><th>當日得分</th></tr></thead><tbody id="historyBody"></tbody></table></div></div></section>

<section id="settingsView" class="section hidden"><div class="settings-grid">
  <div class="panel full"><h3>班級管理</h3><form id="classForm" class="row"><label class="field"><span>新增班級名稱</span><input id="newClassName" class="input" maxlength="20" placeholder="例如：五年級A班"></label><button class="btn primary" type="submit">新增班級</button></form><div id="manageClasses"></div></div>
  <div class="panel"><h3>新增學生</h3><form id="studentForm" class="row"><label class="field"><span>姓名／代號</span><input class="input" id="studentName" required maxlength="12"></label><label class="field"><span>角色</span><select class="select" id="studentAvatar"><option>🌱</option><option>🦖</option><option>🐰</option><option>🐱</option><option>🚀</option><option>⭐</option><option>🐳</option><option>🦊</option></select></label><button class="btn primary" type="submit">新增</button></form></div>
  <div class="panel"><h3>角色成長門檻</h3><div class="row"><label class="field"><span>階段 2</span><input class="input" id="t2" type="number"></label><label class="field"><span>階段 3</span><input class="input" id="t3" type="number"></label><label class="field"><span>階段 4</span><input class="input" id="t4" type="number"></label><label class="field"><span>階段 5</span><input class="input" id="t5" type="number"></label></div><button class="btn primary" id="saveThresholds" style="margin-top:10px">儲存門檻</button><div class="muted" id="thresholdMsg"></div></div>
  <div class="panel full"><h3>新增任務</h3><form id="taskForm" class="row"><label class="field"><span>任務名稱</span><input class="input" id="taskName" required maxlength="40"></label><label class="field"><span>完成積分</span><input class="input" id="taskPoints" type="number" min="1" max="99" value="1"></label><label class="field"><span>任務類型</span><select id="taskType" class="select"><option value="daily">🔁 每日任務</option><option value="once">☑️ 一次性任務</option></select></label><button class="btn primary" type="submit">新增任務</button></form></div>
  <div class="panel full"><h3>學生資料</h3><div id="manageStudents"></div></div>
  <div class="panel full"><h3>任務管理</h3><div id="manageTasks"></div></div>
  <div class="panel full"><h3>資料備份與還原</h3><div class="row"><button class="btn" id="exportBtn">匯出 JSON 備份</button><label class="btn" style="display:inline-flex;align-items:center">匯入 JSON<input id="importFile" type="file" accept=".json" hidden></label><button class="btn danger" id="resetBtn">恢復預設資料</button></div></div>
</div></section>
</div>
<div id="modalLayer"></div>

<script>
(function(){
"use strict";
var KEY="class_points_daily_v1", OLD_KEYS=["class_points_local_multiclass_v3","class_points_local_multiclass_v2"];
function task(id,name,points,type){return{id:id,name:name,points:points,type:type||"daily"}}
function makeClass(name){return{name:name,thresholds:[0,5,10,20,30],students:[],tasks:[task(1,"帶齊學用品",1),task(2,"上課主動回答",2),task(3,"完成課堂任務",1)],dailyRecords:{},onceRecords:{},nextStudent:1,nextTask:4}}
var initial={currentClassId:"grade6",selectedDate:"",classes:{
 grade6:{name:"六年級",thresholds:[0,5,10,20,30],students:[{id:1,name:"學生A",avatar:"🌱",points:0},{id:2,name:"學生B",avatar:"🦖",points:0}],tasks:[task(1,"帶齊學用品",1),task(2,"上課主動回答",2),task(3,"完成課堂任務",1)],dailyRecords:{},onceRecords:{},nextStudent:3,nextTask:4},
 grade5:{name:"五年級",thresholds:[0,5,10,20,30],students:[{id:1,name:"學生A",avatar:"🐰",points:0},{id:2,name:"學生B",avatar:"🚀",points:0}],tasks:[task(1,"帶齊學用品",1),task(2,"上課主動回答",2),task(3,"完成課堂任務",1)],dailyRecords:{},onceRecords:{},nextStudent:3,nextTask:4}
}};
function clone(o){return JSON.parse(JSON.stringify(o))} function $(id){return document.getElementById(id)}
function esc(v){return String(v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return String(n).padStart(2,"0")} function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function toDate(k){var p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])} function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function add(k,n){var d=toDate(k);d.setDate(d.getDate()+n);return key(d)} function showDate(k){var d=toDate(k),w=["日","一","二","三","四","五","六"];return(d.getMonth()+1)+"/"+d.getDate()+"（"+w[d.getDay()]+"）"}
function normalize(x){
 if(!x||!x.classes)return null; var out={currentClassId:x.currentClassId,selectedDate:x.selectedDate||today(),classes:{}};
 Object.keys(x.classes).forEach(function(id){var c=x.classes[id]||{},n=makeClass(String(c.name||id));
  n.thresholds=Array.isArray(c.thresholds)&&c.thresholds.length===5?c.thresholds.map(Number):n.thresholds;
  n.students=Array.isArray(c.students)?c.students.map(function(s){return{id:Number(s.id),name:String(s.name||"未命名"),avatar:String(s.avatar||"🌱"),points:Math.max(0,Number(s.points)||0)}}):[];
  n.tasks=Array.isArray(c.tasks)?c.tasks.map(function(t){return{id:Number(t.id),name:String(t.name||"未命名任務"),points:Math.max(1,Number(t.points)||1),type:t.type==="once"?"once":"daily"}}):[];
  n.dailyRecords=c.dailyRecords&&typeof c.dailyRecords==="object"?c.dailyRecords:{}; n.onceRecords=c.onceRecords&&typeof c.onceRecords==="object"?c.onceRecords:{};
  n.nextStudent=Math.max.apply(null,[Number(c.nextStudent)||1,1].concat(n.students.map(function(s){return s.id+1})));
  n.nextTask=Math.max.apply(null,[Number(c.nextTask)||1,1].concat(n.tasks.map(function(t){return t.id+1}))); out.classes[id]=n;
 }); if(!Object.keys(out.classes).length)return null; if(!out.classes[out.currentClassId])out.currentClassId=Object.keys(out.classes)[0]; return out;
}
function load(){try{var r=localStorage.getItem(KEY);if(r)return normalize(JSON.parse(r))||clone(initial);for(var i=0;i<OLD_KEYS.length;i++){r=localStorage.getItem(OLD_KEYS[i]);if(r){var m=normalize(JSON.parse(r));if(m){m.selectedDate=today();return m}}}}catch(e){}var z=clone(initial);z.selectedDate=today();return z}
var store=load(); function cur(){return store.classes[store.currentClassId]} function save(){localStorage.setItem(KEY,JSON.stringify(store))}
function darr(c,k,tid){if(!c.dailyRecords[k])c.dailyRecords[k]={};if(!Array.isArray(c.dailyRecords[k][tid]))c.dailyRecords[k][tid]=[];return c.dailyRecords[k][tid]}
function done(c,t,sid,k){if(t.type==="once")return!!(c.onceRecords[t.id]&&c.onceRecords[t.id][sid]);var d=c.dailyRecords[k];return!!(d&&Array.isArray(d[t.id])&&d[t.id].indexOf(sid)>=0)}
function toggle(c,t,s,k){if(t.type==="once"){if(!c.onceRecords[t.id])c.onceRecords[t.id]={};if(c.onceRecords[t.id][s.id]){delete c.onceRecords[t.id][s.id];s.points=Math.max(0,s.points-t.points)}else{c.onceRecords[t.id][s.id]=k;s.points+=t.points}}else{var a=darr(c,k,t.id),i=a.indexOf(s.id);if(i>=0){a.splice(i,1);s.points=Math.max(0,s.points-t.points)}else{a.push(s.id);s.points+=t.points}}}
function stage(p){var c=cur(),s=1;for(var i=1;i<c.thresholds.length;i++)if(p>=c.thresholds[i])s=i+1;return s} function next(p){var c=cur(),s=stage(p);if(s>=5)return{remain:0,pct:100};var lo=c.thresholds[s-1],hi=c.thresholds[s];return{remain:hi-p,pct:Math.max(0,Math.min(100,(p-lo)/(hi-lo)*100))}}
function dayStats(k){var c=cur(),count=0,score=0;c.tasks.forEach(function(t){if(t.type==="daily"){var d=c.dailyRecords[k],a=d&&Array.isArray(d[t.id])?d[t.id]:[];count+=a.length;score+=a.length*t.points}else if(c.onceRecords[t.id])Object.keys(c.onceRecords[t.id]).forEach(function(sid){if(c.onceRecords[t.id][sid]===k){count++;score+=t.points}})});return{count:count,score:score}}
function rate(){var c=cur(),daily=c.tasks.filter(function(t){return t.type==="daily"}),total=daily.length*c.students.length,n=0;if(!total)return 0;daily.forEach(function(t){var d=c.dailyRecords[store.selectedDate],a=d&&Array.isArray(d[t.id])?d[t.id]:[];n+=a.length});return Math.round(n/total*100)}
function modal(h){$("modalLayer").innerHTML='<div class="modal-backdrop"><div class="modal">'+h+'<div class="close-row"><button class="btn primary" id="closeModal">關閉</button></div></div></div>';$("closeModal").onclick=function(){$("modalLayer").innerHTML=""}}
function render(){
 var c=cur(),k=store.selectedDate||today(),ids=Object.keys(store.classes),sel=$("classSelect");sel.innerHTML="";ids.forEach(function(id){var o=document.createElement("option");o.value=id;o.textContent="🏫 "+store.classes[id].name;o.selected=id===store.currentClassId;sel.appendChild(o)});
 $("dateInput").value=k;$("dateLabel").textContent=showDate(k);$("todayHint").textContent=k===today()?"今天":"歷史日期";$("sumClass").textContent=c.name;$("sumDate").textContent=(k===today()?"今天 ":"")+showDate(k);$("sumTasks").textContent=c.tasks.length;$("sumRate").textContent=rate()+"%";$("sumStudents").textContent=c.students.length+" 人";
 $("taskGrid").innerHTML=c.tasks.map(function(t){var n=c.students.filter(function(s){return done(c,t,s.id,k)}).length,pct=c.students.length?Math.round(n/c.students.length*100):0;return'<article class="task-card"><div class="task-head"><span class="badge '+(t.type==="once"?"once":"daily")+'">'+(t.type==="once"?"☑ 一次性任務":"🔁 每日任務")+'</span><div class="task-title">'+esc(t.name)+'</div><div class="meta">完成 +'+t.points+' 點 · '+(t.type==="daily"?"每天可重新完成":"完成後持續保留")+'</div><div style="display:flex;justify-content:space-between;margin-top:10px;font-size:14px"><b>完成人數</b><b>'+n+'/'+c.students.length+' 人　'+pct+'%</b></div><div class="progress"><div style="width:'+pct+'%"></div></div></div><div class="student-list">'+c.students.map(function(s){var d=done(c,t,s.id,k),sub=d?(t.type==="once"?"✓ 已完成 "+c.onceRecords[t.id][s.id]:"✓ 本日已完成"):s.points+" 點";return'<button class="student-btn '+(d?(t.type==="once"?"once-done":"done"):"")+'" data-task="'+t.id+'" data-student="'+s.id+'">'+esc(s.name)+'<small>'+esc(sub)+'</small></button>'}).join("")+'</div></article>'}).join("");
 $("growthGrid").innerHTML=c.students.map(function(s){var st=stage(s.points),n=next(s.points),ds=0;c.tasks.forEach(function(t){if(t.type==="daily"){var d=c.dailyRecords[k],a=d&&Array.isArray(d[t.id])?d[t.id]:[];if(a.indexOf(s.id)>=0)ds+=t.points}else if(c.onceRecords[t.id]&&c.onceRecords[t.id][s.id]===k)ds+=t.points});return'<article class="growth-card"><div class="avatar s'+st+'">'+esc(s.avatar)+'</div><div style="font-weight:900;font-size:18px">'+esc(s.name)+'</div><div style="font-size:28px;font-weight:900;color:var(--green)">'+s.points+' 點</div><div class="muted">本日 +'+ds+'｜階段 '+st+'/5 · '+(st===5?"最高階段":"再 "+n.remain+" 點升級")+'</div><div class="progress"><div style="width:'+n.pct+'%"></div></div><div class="grow-actions"><button class="btn primary" data-add="1" data-id="'+s.id+'">+1</button><button class="btn" data-add="5" data-id="'+s.id+'">+5</button><button class="btn" data-add="-1" data-id="'+s.id+'">-1</button></div></article>'}).join("");
 $("manageStudents").innerHTML=c.students.map(function(s){return'<div class="manage-row"><label class="field"><span>姓名／代號</span><input class="input edit-name" data-id="'+s.id+'" value="'+esc(s.name)+'"></label><label class="field"><span>角色</span><select class="select edit-avatar" data-id="'+s.id+'">'+["🌱","🦖","🐰","🐱","🚀","⭐","🐳","🦊"].map(function(a){return'<option '+(a===s.avatar?"selected":"")+'>'+a+'</option>'}).join("")+'</select></label><label class="field"><span>總積分</span><input class="input edit-points" type="number" data-id="'+s.id+'" value="'+s.points+'"></label><button class="btn danger delete-student" data-id="'+s.id+'">刪除</button></div>'}).join("");
 $("manageTasks").innerHTML=c.tasks.map(function(t){return'<div class="task-manage-row"><label class="field"><span>任務名稱</span><input class="input edit-task-name" data-id="'+t.id+'" value="'+esc(t.name)+'"></label><label class="field"><span>積分</span><input class="input edit-task-points" type="number" data-id="'+t.id+'" value="'+t.points+'"></label><label class="field"><span>類型</span><select class="select edit-task-type" data-id="'+t.id+'"><option value="daily" '+(t.type==="daily"?"selected":"")+'>🔁 每日</option><option value="once" '+(t.type==="once"?"selected":"")+'>☑️ 一次性</option></select></label><button class="btn danger delete-task" data-id="'+t.id+'">刪除</button></div>'}).join("");
 $("manageClasses").innerHTML=ids.map(function(id){return'<div class="class-manage"><div><b>'+esc(store.classes[id].name)+'</b><div class="muted">'+store.classes[id].students.length+' 位學生</div></div>'+(ids.length>1?'<button class="btn danger delete-class" data-id="'+id+'">刪除班級</button>':"")+'</div>'}).join("");
 ["t2","t3","t4","t5"].forEach(function(id,i){$(id).value=c.thresholds[i+1]});
 var rows=[];for(var i=30;i>=0;i--){var dk=add(today(),-i),st=dayStats(dk);rows.push("<tr><td>"+showDate(dk)+"</td><td>"+st.count+"</td><td>+"+st.score+"</td></tr>")}$("historyBody").innerHTML=rows.join("");save();
}
function tab(n){["tasks","growth","history","settings"].forEach(function(x){$(x+"View").classList.toggle("hidden",x!==n);var b=document.querySelector('[data-tab="'+x+'"]');if(b)b.classList.toggle("active",x===n)})}
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){tab(b.dataset.tab)}});$("classSelect").onchange=function(e){store.currentClassId=e.target.value;render()};$("prevDay").onclick=function(){store.selectedDate=add(store.selectedDate,-1);render()};$("nextDay").onclick=function(){store.selectedDate=add(store.selectedDate,1);render()};$("todayBtn").onclick=function(){store.selectedDate=today();render()};$("dateInput").onchange=function(e){if(e.target.value){store.selectedDate=e.target.value;render()}};
$("newTaskBtn").onclick=function(){tab("settings");$("taskName").focus()};$("backupBtn").onclick=function(){tab("settings")};$("randomBtn").onclick=function(){var c=cur();if(c.students.length){var s=c.students[Math.floor(Math.random()*c.students.length)];modal("<h3>🎲 抽籤結果</h3><div style='font-size:30px;font-weight:900;text-align:center;padding:18px'>"+esc(s.name)+"</div>")}};
$("reportBtn").onclick=function(){var c=cur(),k=store.selectedDate,rows=c.students.map(function(s){var ds=0;c.tasks.forEach(function(t){if(t.type==="daily"){var d=c.dailyRecords[k],a=d&&Array.isArray(d[t.id])?d[t.id]:[];if(a.indexOf(s.id)>=0)ds+=t.points}else if(c.onceRecords[t.id]&&c.onceRecords[t.id][s.id]===k)ds+=t.points});return"<tr><td>"+esc(s.name)+"</td><td>+"+ds+"</td><td>"+s.points+"</td></tr>"}).join("");modal("<h3>📄 "+esc(c.name)+"｜"+showDate(k)+"</h3><table class='report-table'><thead><tr><th>學生</th><th>當日得分</th><th>總積分</th></tr></thead><tbody>"+rows+"</tbody></table>")};
$("taskGrid").onclick=function(e){var b=e.target.closest("[data-task]");if(!b)return;var c=cur(),t=c.tasks.find(function(x){return x.id===Number(b.dataset.task)}),s=c.students.find(function(x){return x.id===Number(b.dataset.student)});if(t&&s){toggle(c,t,s,store.selectedDate);render()}};
$("growthGrid").onclick=function(e){var b=e.target.closest("[data-add]");if(!b)return;var s=cur().students.find(function(x){return x.id===Number(b.dataset.id)});if(s){s.points=Math.max(0,s.points+Number(b.dataset.add));render()}};
$("classForm").onsubmit=function(e){e.preventDefault();var name=$("newClassName").value.trim();if(name){var id="class_"+Date.now();store.classes[id]=makeClass(name);store.currentClassId=id;$("newClassName").value="";render()}};
$("studentForm").onsubmit=function(e){e.preventDefault();var c=cur(),name=$("studentName").value.trim();if(name){c.students.push({id:c.nextStudent++,name:name,avatar:$("studentAvatar").value,points:0});$("studentName").value="";render()}};
$("taskForm").onsubmit=function(e){e.preventDefault();var c=cur(),name=$("taskName").value.trim();if(name){c.tasks.push({id:c.nextTask++,name:name,points:Math.max(1,Number($("taskPoints").value)||1),type:$("taskType").value});$("taskName").value="";render();tab("tasks")}};
$("saveThresholds").onclick=function(){var v=[0,Number($("t2").value),Number($("t3").value),Number($("t4").value),Number($("t5").value)];if(v[1]>0&&v[1]<v[2]&&v[2]<v[3]&&v[3]<v[4]){cur().thresholds=v;$("thresholdMsg").textContent="已儲存。";render()}else $("thresholdMsg").textContent="門檻必須依序遞增。"};
$("manageStudents").onchange=function(e){var s=cur().students.find(function(x){return x.id===Number(e.target.dataset.id)});if(!s)return;if(e.target.classList.contains("edit-name"))s.name=e.target.value.trim()||"未命名";if(e.target.classList.contains("edit-avatar"))s.avatar=e.target.value;if(e.target.classList.contains("edit-points"))s.points=Math.max(0,Number(e.target.value)||0);render()};
$("manageStudents").onclick=function(e){var b=e.target.closest(".delete-student");if(!b)return;var c=cur(),id=Number(b.dataset.id);c.students=c.students.filter(function(s){return s.id!==id});Object.keys(c.dailyRecords).forEach(function(dk){Object.keys(c.dailyRecords[dk]).forEach(function(tid){c.dailyRecords[dk][tid]=c.dailyRecords[dk][tid].filter(function(x){return Number(x)!==id})})});Object.keys(c.onceRecords).forEach(function(tid){delete c.onceRecords[tid][id]});render()};
$("manageTasks").onchange=function(e){var c=cur(),t=c.tasks.find(function(x){return x.id===Number(e.target.dataset.id)});if(!t)return;if(e.target.classList.contains("edit-task-name"))t.name=e.target.value.trim()||"未命名任務";if(e.target.classList.contains("edit-task-points"))t.points=Math.max(1,Number(e.target.value)||1);if(e.target.classList.contains("edit-task-type")){var old=t.type;if(old!==e.target.value){if(confirm("切換任務類型會清除這個任務的既有完成紀錄，但不調整目前總積分。確定嗎？")){t.type=e.target.value;Object.keys(c.dailyRecords).forEach(function(dk){delete c.dailyRecords[dk][t.id]});delete c.onceRecords[t.id]}else e.target.value=old}}render()};
$("manageTasks").onclick=function(e){var b=e.target.closest(".delete-task");if(!b)return;var c=cur(),id=Number(b.dataset.id);c.tasks=c.tasks.filter(function(t){return t.id!==id});Object.keys(c.dailyRecords).forEach(function(dk){delete c.dailyRecords[dk][id]});delete c.onceRecords[id];render()};
$("manageClasses").onclick=function(e){var b=e.target.closest(".delete-class");if(!b||Object.keys(store.classes).length<=1)return;delete store.classes[b.dataset.id];if(!store.classes[store.currentClassId])store.currentClassId=Object.keys(store.classes)[0];render()};
$("exportBtn").onclick=function(){var blob=new Blob([JSON.stringify(store,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="班級積點每日紀錄備份.json";a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},500)};
$("importFile").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{store=normalize(JSON.parse(r.result))||store;render();modal("<h3>匯入成功</h3><p>班級、每日紀錄與積分都已還原。</p>")}catch(err){modal("<h3>匯入失敗</h3>")}e.target.value=""};r.readAsText(f)};
$("resetBtn").onclick=function(){if(confirm("確定清除全部資料？")){store=clone(initial);store.selectedDate=today();render()}};
render();
})();
</script>
