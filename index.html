<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>班級任務積點成長系統</title>
<style>
:root{
  --bg:#f8efec; --panel:#fffaf8; --card:#ffffff; --line:#ead0c9;
  --green:#167a49; --green-2:#e7f5ed; --ink:#342a27; --muted:#7d6d68;
  --danger:#b94a48; --shadow:0 6px 18px rgba(82,54,45,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1500px;margin:auto;padding:18px}
.topbar{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-icon{width:44px;height:44px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:23px}
.brand-title{font-weight:900;font-size:19px}
.muted{font-size:13px;color:var(--muted)}
.btn,.select,.input{
  min-height:42px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;color:var(--ink)
}
.btn{font-weight:800}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.soft{background:var(--green-2);color:var(--green);border-color:#a8cfb8}
.btn.danger{color:var(--danger)}
.summary{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px;box-shadow:var(--shadow)
}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{color:var(--muted)} .stat strong{display:block;font-size:28px;color:var(--green);margin-top:2px}
.notice{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tab.active{background:var(--green-2);color:var(--green);border-color:var(--green)}
.section{margin-top:16px}
.task-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.task-card{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}
.task-head{background:#fff;padding:15px}
.badge{display:inline-flex;background:var(--green);color:#fff;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}
.task-title{font-size:18px;font-weight:900;margin-top:10px}
.meta{font-size:13px;color:var(--muted);margin-top:5px}
.progress{height:10px;border-radius:999px;background:#eadeda;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--green)}
.student-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px;background:#fff7f4;border-top:1px solid var(--line)}
.student-btn{min-height:50px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px;font-weight:800}
.student-btn.done{background:var(--green-2);border-color:#9cc8ad;color:var(--green)}
.student-btn small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.growth-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.growth-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;text-align:center;box-shadow:var(--shadow)}
.avatar{display:grid;place-items:center;margin:0 auto 8px;border-radius:999px;background:#fff4ef;border:2px solid var(--line)}
.s1{width:60px;height:60px;font-size:30px}.s2{width:74px;height:74px;font-size:37px}.s3{width:88px;height:88px;font-size:44px}.s4{width:102px;height:102px;font-size:51px}.s5{width:118px;height:118px;font-size:60px}
.grow-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}
.full{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px}
.manage-row{display:grid;grid-template-columns:1fr 100px 120px auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff8f5;margin-top:8px}
.task-manage-row{display:grid;grid-template-columns:1fr 120px auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff8f5;margin-top:8px}
.hidden{display:none!important}
.modal-backdrop{position:fixed;inset:0;background:rgba(40,30,26,.32);display:grid;place-items:center;padding:20px;z-index:20}
.modal{width:min(520px,100%);background:#fff;border-radius:18px;border:1px solid var(--line);padding:18px;box-shadow:0 18px 50px rgba(50,30,20,.2)}
.modal h3{margin-top:0}
.close-row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.report-table{width:100%;border-collapse:collapse;margin-top:10px}
.report-table th,.report-table td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
@media(max-width:1000px){.task-grid,.growth-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
  .app{padding:10px}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .task-grid,.growth-grid,.settings-grid{grid-template-columns:1fr}
  .full{grid-column:auto}.manage-row,.task-manage-row{grid-template-columns:1fr}
  .student-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar>*{min-width:0}.topbar .btn,.topbar .select{flex:1}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">🏫</div>
      <div><div class="brand-title">班級任務積點</div><div class="muted">個人積分 × 角色成長</div></div>
    </div>
    <select id="classSelect" class="select" aria-label="班級">
      <option>六年級</option><option>五年級</option><option>四年級</option>
    </select>
    <button class="btn" id="randomBtn">🎲 抽籤</button>
    <button class="btn" id="soundBtn">🔊 音效：開</button>
    <button class="btn" id="reportBtn">📄 報表</button>
    <button class="btn" id="rosterBtn">👥 名單</button>
    <button class="btn primary" id="newTaskBtn">＋ 新增任務</button>
  </header>

  <section class="summary">
    <div class="stat"><small>目前班級</small><strong id="sumClass">六年級</strong></div>
    <div class="stat"><small>進行中任務</small><strong id="sumTasks">0</strong></div>
    <div class="stat"><small>班級完成率</small><strong id="sumRate">0%</strong></div>
    <div class="stat"><small>班級員額</small><strong id="sumStudents">0 人</strong></div>
  </section>

  <section class="notice">
    <b>💡 操作方式：</b>
    <span class="muted">點學生姓名即可完成／取消任務；完成後自動加上該任務積分。學生達到門檻時，角色會自動長大。所有設定會儲存在這台瀏覽器。</span>
  </section>

  <nav class="tabs">
    <button class="btn tab active" data-tab="tasks">任務看板</button>
    <button class="btn tab" data-tab="growth">學生角色成長</button>
    <button class="btn tab" data-tab="settings">教師設定</button>
  </nav>

  <section id="tasksView" class="section"><div id="taskGrid" class="task-grid"></div></section>
  <section id="growthView" class="section hidden"><div id="growthGrid" class="growth-grid"></div></section>

  <section id="settingsView" class="section hidden">
    <div class="settings-grid">
      <div class="panel">
        <h3>新增學生</h3>
        <form id="studentForm" class="row">
          <label class="field"><span>姓名</span><input class="input" id="studentName" required maxlength="12" placeholder="例如：陳品安"></label>
          <label class="field"><span>角色</span>
            <select class="select" id="studentAvatar"><option>🌱</option><option>🦖</option><option>🐰</option><option>🐱</option><option>🚀</option><option>⭐</option><option>🐳</option><option>🦊</option><option>🐼</option><option>🦁</option></select>
          </label>
          <button class="btn primary" type="submit">新增</button>
        </form>
      </div>

      <div class="panel">
        <h3>角色成長門檻</h3>
        <div class="row">
          <label class="field"><span>階段 2</span><input class="input" id="t2" type="number" min="1"></label>
          <label class="field"><span>階段 3</span><input class="input" id="t3" type="number" min="2"></label>
          <label class="field"><span>階段 4</span><input class="input" id="t4" type="number" min="3"></label>
          <label class="field"><span>階段 5</span><input class="input" id="t5" type="number" min="4"></label>
        </div>
        <button class="btn primary" id="saveThresholds" style="margin-top:10px">儲存門檻</button>
        <div class="muted" id="thresholdMsg" style="margin-top:7px"></div>
      </div>

      <div class="panel full">
        <h3>新增任務</h3>
        <form id="taskForm" class="row">
          <label class="field"><span>任務名稱</span><input class="input" id="taskName" required maxlength="40" placeholder="例如：帶齊學用品"></label>
          <label class="field"><span>完成積分</span><input class="input" id="taskPoints" type="number" min="1" max="99" value="1"></label>
          <button class="btn primary" type="submit">新增任務</button>
        </form>
      </div>

      <div class="panel full">
        <h3>學生資料</h3>
        <div id="manageStudents"></div>
      </div>

      <div class="panel full">
        <h3>任務管理</h3>
        <div id="manageTasks"></div>
      </div>

      <div class="panel full">
        <h3>資料管理</h3>
        <div class="row">
          <button class="btn" id="exportBtn">匯出 JSON 備份</button>
          <label class="btn" style="display:inline-flex;align-items:center">匯入 JSON<input id="importFile" type="file" accept=".json" hidden></label>
          <button class="btn danger" id="resetBtn">恢復預設資料</button>
        </div>
      </div>
    </div>
  </section>
</div>

<div id="modalLayer"></div>

<script>
(() => {
const KEY='class_point_growth_v1';
const defaultState={
  className:'六年級',
  sound:true,
  thresholds:[0,5,10,20,30],
  students:[
    {id:1,name:'盧顥榮',avatar:'🌱',points:3},
    {id:2,name:'陳彥希',avatar:'🦖',points:7},
    {id:3,name:'何宸宇',avatar:'🐰',points:2},
    {id:4,name:'郭哲安',avatar:'🚀',points:11},
    {id:5,name:'高泳岑',avatar:'⭐',points:18},
    {id:6,name:'林謙',avatar:'🐳',points:5}
  ],
  tasks:[
    {id:1,name:'帶齊學用品（聯絡簿、作業、課本、鉛筆盒）',points:1,done:[]},
    {id:2,name:'上課回答主動積極',points:2,done:[]},
    {id:3,name:'額外加分（學習態度）',points:1,done:[]},
    {id:4,name:'課堂任務要完成',points:1,done:[]},
    {id:5,name:'課事小動思考',points:2,done:[]},
    {id:6,name:'按時到班不遲到（打鐘五分鐘後）',points:1,done:[]}
  ],
  nextStudent:7,nextTask:7
};
let state=load();

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return structuredClone(defaultState);
    const data=JSON.parse(raw);
    return Object.assign(structuredClone(defaultState),data);
  }catch(e){ return structuredClone(defaultState); }
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function stage(p){let s=1;for(let i=1;i<state.thresholds.length;i++)if(p>=state.thresholds[i])s=i+1;return s}
function nextInfo(p){
  const s=stage(p);
  if(s>=5)return {remain:0,pct:100};
  const low=state.thresholds[s-1],high=state.thresholds[s];
  return {remain:Math.max(0,high-p),pct:Math.max(0,Math.min(100,((p-low)/(high-low))*100))}
}
function rate(){
  const total=state.tasks.length*state.students.length;
  if(!total)return 0;
  return Math.round(state.tasks.reduce((a,t)=>a+t.done.length,0)/total*100)
}
function render(){
  $('#classSelect').value=state.className;
  $('#soundBtn').textContent=state.sound?'🔊 音效：開':'🔇 音效：關';
  $('#sumClass').textContent=state.className;
  $('#sumTasks').textContent=state.tasks.length;
  $('#sumRate').textContent=rate()+'%';
  $('#sumStudents').textContent=state.students.length+' 人';

  $('#taskGrid').innerHTML=state.tasks.map(t=>{
    const pct=state.students.length?Math.round(t.done.length/state.students.length*100):0;
    return `<article class="task-card">
      <div class="task-head">
        <span class="badge">✔ 獨立任務</span>
        <div class="task-title">${esc(t.name)}</div>
        <div class="meta">完成可獲得 ${t.points} 點</div>
        <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:14px"><b>已完成人數</b><b>${t.done.length} / ${state.students.length} 人　${pct}%</b></div>
        <div class="progress"><div style="width:${pct}%"></div></div>
      </div>
      <div class="student-list">
        ${state.students.map(s=>{
          const done=t.done.includes(s.id);
          return `<button class="student-btn ${done?'done':''}" data-task="${t.id}" data-student="${s.id}">
            ${esc(s.name)}<small>${done?'✓ 已完成':s.points+' 點'}</small>
          </button>`;
        }).join('')}
      </div>
    </article>`;
  }).join('');

  $('#growthGrid').innerHTML=state.students.map(s=>{
    const st=stage(s.points), n=nextInfo(s.points);
    return `<article class="growth-card">
      <div class="avatar s${st}">${esc(s.avatar)}</div>
      <div style="font-weight:900;font-size:18px">${esc(s.name)}</div>
      <div style="font-size:28px;font-weight:900;color:var(--green)">${s.points} 點</div>
      <div class="muted">成長階段 ${st}/5 · ${st===5?'已達最高階段':'再 '+n.remain+' 點升級'}</div>
      <div class="progress"><div style="width:${n.pct}%"></div></div>
      <div class="grow-actions">
        <button class="btn primary" data-add="1" data-id="${s.id}">+1</button>
        <button class="btn" data-add="5" data-id="${s.id}">+5</button>
        <button class="btn" data-add="-1" data-id="${s.id}">-1</button>
      </div>
    </article>`;
  }).join('');

  $('#manageStudents').innerHTML=state.students.map(s=>`
    <div class="manage-row">
      <label class="field"><span>姓名</span><input class="input edit-name" data-id="${s.id}" value="${esc(s.name)}"></label>
      <label class="field"><span>角色</span><select class="select edit-avatar" data-id="${s.id}">
      ${['🌱','🦖','🐰','🐱','🚀','⭐','🐳','🦊','🐼','🦁'].map(a=>`<option ${a===s.avatar?'selected':''}>${a}</option>`).join('')}
      </select></label>
      <label class="field"><span>積分</span><input class="input edit-points" type="number" min="0" max="9999" data-id="${s.id}" value="${s.points}"></label>
      <button class="btn danger delete-student" data-id="${s.id}">刪除</button>
    </div>`).join('');

  $('#manageTasks').innerHTML=state.tasks.map(t=>`
    <div class="task-manage-row">
      <label class="field"><span>任務名稱</span><input class="input edit-task-name" data-id="${t.id}" value="${esc(t.name)}"></label>
      <label class="field"><span>積分</span><input class="input edit-task-points" data-id="${t.id}" type="number" min="1" max="99" value="${t.points}"></label>
      <button class="btn danger delete-task" data-id="${t.id}">刪除</button>
    </div>`).join('');

  ['t2','t3','t4','t5'].forEach((id,i)=>$('#'+id).value=state.thresholds[i+1]);
  save();
}
function switchTab(name){
  ['tasks','growth','settings'].forEach(n=>{
    $('#'+n+'View').classList.toggle('hidden',n!==name);
    document.querySelector(`[data-tab="${n}"]`).classList.toggle('active',n===name);
  });
}
function modal(html){
  $('#modalLayer').innerHTML=`<div class="modal-backdrop"><div class="modal">${html}<div class="close-row"><button class="btn primary" id="closeModal">關閉</button></div></div></div>`;
  $('#closeModal').onclick=()=>$('#modalLayer').innerHTML='';
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
$('#classSelect').addEventListener('change',e=>{state.className=e.target.value;render()});
$('#soundBtn').addEventListener('click',()=>{state.sound=!state.sound;render()});
$('#randomBtn').addEventListener('click',()=>{
  if(!state.students.length)return;
  const s=state.students[Math.floor(Math.random()*state.students.length)];
  modal(`<h3>🎲 抽籤結果</h3><div style="font-size:30px;font-weight:900;text-align:center;padding:18px">${esc(s.name)}</div>`);
});
$('#reportBtn').addEventListener('click',()=>{
  const rows=state.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.points}</td><td>${stage(s.points)}</td></tr>`).join('');
  modal(`<h3>📄 班級報表</h3><div class="muted">完成率 ${rate()}%｜總積分 ${state.students.reduce((a,s)=>a+s.points,0)} 點</div>
  <table class="report-table"><thead><tr><th>學生</th><th>積分</th><th>階段</th></tr></thead><tbody>${rows}</tbody></table>`);
});
$('#rosterBtn').addEventListener('click',()=>switchTab('settings'));
$('#newTaskBtn').addEventListener('click',()=>{switchTab('settings');$('#taskName').focus()});

$('#taskGrid').addEventListener('click',e=>{
  const b=e.target.closest('[data-task]'); if(!b)return;
  const t=state.tasks.find(x=>x.id===+b.dataset.task);
  const s=state.students.find(x=>x.id===+b.dataset.student);
  if(!t||!s)return;
  const idx=t.done.indexOf(s.id);
  if(idx>=0){t.done.splice(idx,1);s.points=Math.max(0,s.points-t.points)}
  else{t.done.push(s.id);s.points+=t.points}
  render();
});
$('#growthGrid').addEventListener('click',e=>{
  const b=e.target.closest('[data-add]');if(!b)return;
  const s=state.students.find(x=>x.id===+b.dataset.id);if(!s)return;
  s.points=Math.max(0,Math.min(9999,s.points+(+b.dataset.add)));render()
});
$('#studentForm').addEventListener('submit',e=>{
  e.preventDefault(); const name=$('#studentName').value.trim(); if(!name)return;
  state.students.push({id:state.nextStudent++,name,avatar:$('#studentAvatar').value,points:0});
  $('#studentName').value=''; render()
});
$('#taskForm').addEventListener('submit',e=>{
  e.preventDefault(); const name=$('#taskName').value.trim(); if(!name)return;
  const points=Math.max(1,Math.min(99,+$('#taskPoints').value||1));
  state.tasks.push({id:state.nextTask++,name,points,done:[]});
  $('#taskName').value='';$('#taskPoints').value=1;render();switchTab('tasks')
});
$('#saveThresholds').addEventListener('click',()=>{
  const vals=[0,+$('#t2').value,+$('#t3').value,+$('#t4').value,+$('#t5').value];
  if(!(vals[1]>0&&vals[1]<vals[2]&&vals[2]<vals[3]&&vals[3]<vals[4])){
    $('#thresholdMsg').textContent='門檻必須依序遞增，例如 5、10、20、30。';return
  }
  state.thresholds=vals;$('#thresholdMsg').textContent='已儲存。';render()
});
$('#manageStudents').addEventListener('change',e=>{
  const s=state.students.find(x=>x.id===+e.target.dataset.id);if(!s)return;
  if(e.target.classList.contains('edit-name'))s.name=e.target.value.trim()||'未命名';
  if(e.target.classList.contains('edit-avatar'))s.avatar=e.target.value;
  if(e.target.classList.contains('edit-points'))s.points=Math.max(0,Math.min(9999,+e.target.value||0));
  render()
});
$('#manageStudents').addEventListener('click',e=>{
  const b=e.target.closest('.delete-student');if(!b)return;
  const id=+b.dataset.id;state.students=state.students.filter(s=>s.id!==id);state.tasks.forEach(t=>t.done=t.done.filter(x=>x!==id));render()
});
$('#manageTasks').addEventListener('change',e=>{
  const t=state.tasks.find(x=>x.id===+e.target.dataset.id);if(!t)return;
  if(e.target.classList.contains('edit-task-name'))t.name=e.target.value.trim()||'未命名任務';
  if(e.target.classList.contains('edit-task-points'))t.points=Math.max(1,Math.min(99,+e.target.value||1));
  render()
});
$('#manageTasks').addEventListener('click',e=>{
  const b=e.target.closest('.delete-task');if(!b)return;
  state.tasks=state.tasks.filter(t=>t.id!==+b.dataset.id);render()
});
$('#exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='班級積點備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)
});
$('#importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!Array.isArray(data.students)||!Array.isArray(data.tasks))throw new Error();
    state=Object.assign(structuredClone(defaultState),data);render();modal('<h3>匯入成功</h3><div class="muted">資料已載入並儲存在瀏覽器。</div>')
  }catch{modal('<h3>匯入失敗</h3><div class="muted">請確認檔案是由本系統匯出的 JSON 備份。</div>')}
  e.target.value=''
});
$('#resetBtn').addEventListener('click',()=>{
  if(confirm('確定要恢復預設資料嗎？目前資料會被清除。')){state=structuredClone(defaultState);render()}
});
render();
})();
</script>
</body>
</html>
